# Cloudflare Workers の設定ファイル(wrangler CLI を使う人向け。
# ダッシュボードでコピペ導入する場合、このファイルは使いません)
name = "ai-jissen-assist-api"
main = "worker.js"
compatibility_date = "2026-07-01"

# 秘密情報(OPENAI_API_KEY / APP_ACCESS_TOKEN)はここに書かないこと!
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put APP_ACCESS_TOKEN
# で登録します。

[vars]
# モデルは環境変数で変更できます
OPENAI_MODEL = "gpt-5.6-luna"
# 許可するサイト(カンマ区切りで複数可)
ALLOWED_ORIGIN = "https://t8619287-crypto.github.io"
